<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Cocina | Gastro-Sys-Fusion</title>
    <!-- CSS Base -->
    <link rel="stylesheet" href="css/base/index.css?v=1.0.2" />
    <link rel="stylesheet" href="css/login.css" />
    <!-- CSS Específico -->
    <link rel="stylesheet" href="css/cocina.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👨‍🍳</text></svg>" />
</head>
<body>
    <!-- ===========================
         NAVBAR
    ============================ -->
    <header>
        <nav class="navbar" role="navigation" aria-label="Navegación principal">
            <a class="navbar__brand" href="../index.html" id="navbar-brand-link">
                <div class="navbar__brand-icon" aria-hidden="true">🍽️</div>
                <span class="navbar__brand-name">Gastro-Sys-Fusion</span>
            </a>

            <!-- Conmutador central para personal de cocina -->
            <div class="navbar__center-switcher" id="navbar-center-switcher">
                <div class="nav-switcher">
                    <a href="cocina.html" class="nav-switcher-btn active--gold" id="switcher-cocina">
                        <span>🍳</span> Cocina
                    </a>
                    <a href="inventario.html" class="nav-switcher-btn" id="switcher-inventario">
                        <span>📦</span> Inventario
                    </a>
                </div>
            </div>

            <ul class="navbar__nav" role="list">
                <li><a href="../index.html#menu" id="nav-menu-link">Menú</a></li>
                <li><a href="../index.html#nosotros" id="nav-nosotros-link">Nosotros</a></li>
                <li><a href="../index.html#contacto" id="nav-contacto-link">Contacto</a></li>
                <li><a href="login.html" class="navbar__cta" id="nav-reservar-link">Iniciar Sesión</a></li>
                <li><a href="cocina.html" class="navbar__cta navbar__cta--admin" id="nav-cocina-link">Cocina</a></li>
                <li><a href="inventario.html" class="navbar__cta navbar__cta--admin" id="nav-inventario-link">Inventario</a></li>
                <li><a href="mermas.html" class="navbar__cta navbar__cta--admin" id="nav-mermas-link">Mermas</a></li>
                <li><a href="proveedores.html" class="navbar__cta navbar__cta--admin" id="nav-proveedores-link">Proveedores</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenedor Principal -->
    <main class="kitchen-main">
        <div class="kitchen-status-bar" id="kitchen-status-bar">
            <span class="status-indicator live"></span>
            <span id="kitchen-status-text">Conectado — Actualizando cada 10s</span>
        </div>
        <div id="loading-state" class="kitchen-loading">Cargando pedidos activos...</div>
        <div id="empty-state" class="kitchen-empty" hidden>
            <h2>No hay pedidos pendientes</h2>
            <p>Buen trabajo equipo. A esperar nuevas comandas.</p>
        </div>
        <!-- Grilla donde se pintan los pedidos -->
        <div id="orders-grid" class="kitchen-grid" role="list"></div>
    </main>

    <!-- Template para la tarjeta de pedido -->
    <template id="order-card-template">
        <article class="order-card">
            <div class="order-header">
                <span class="order-id">#ID</span>
                <span class="order-time">0m</span>
            </div>
            <div class="order-status">Estado</div>
            <ul class="order-items"></ul>
            <div class="order-actions">
                <button class="btn-ready">Marcar como Listo</button>
            </div>
        </article>
    </template>

    <!-- Scripts -->
    <script>window.__ROLES_PERMITIDOS = ['jefe_cocina', 'administrador', 'gerente'];</script>
    <script src="js/config.js?v=1.0.1"></script>
    <script src="js/auth-guard.js?v=1.0.2"></script>
    <script src="js/cocina.js"></script>
</body>
</html>
